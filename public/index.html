<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Party Pay y la reposición del distribuidor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23e23d2b'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@380;520;650&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="marca">Party Pay · el distribuidor</p>
        <h1>La tienda paga sola.</h1>
      </div>
      <div class="top-acciones">
        <a class="ghost" href="/presentacion">Presentación</a>
        <button id="reiniciar" type="button" class="ghost">Empezar la demo de nuevo</button>
      </div>
    </header>

    <section id="aviso" class="aviso" hidden></section>
    <section id="resultado" class="resultado" hidden></section>

    <div class="escenario">
      <section class="lado party" id="lado-party">
        <header class="lado-head">
          <p class="kicker">Ya funciona</p>
          <h2>Party Pay</h2>
        </header>
        <div id="guia-party"></div>
        <div class="telefono" aria-label="Simulación de Party Pay">
          <div class="telefono-top">
            <span>Party Pay</span>
            <span id="evento">Feria nocturna</span>
          </div>
          <p class="telefono-lugar"><strong id="tienda">Bar La Ruta</strong></p>
          <p class="telefono-nota">Inventario</p>
          <div id="productos"></div>
          <div class="telefono-pie">
            <span>Vendidas esta noche</span>
            <strong><b id="rojos">0</b></strong>
          </div>
          <div id="ventas-phone" class="ventas-phone"></div>
        </div>
      </section>

      <section class="lado sistema" id="lado-sistema">
        <header class="lado-head">
          <p class="kicker">Este sistema</p>
          <h2>El distribuidor</h2>
        </header>
        <div id="guia-sistema"></div>
        <div id="promesas" class="promesas"></div>
        <div class="columnas-internas">
          <div>
            <h3>La tienda paga</h3>
            <div id="saldo-agente" class="saldos"></div>
            <div id="limites" class="limites"></div>
          </div>
          <div>
            <h3 id="proveedor">Cervecería del Valle</h3>
            <div id="saldo-proveedor" class="saldos"></div>
            <div id="pedidos"></div>
          </div>
        </div>
        <details class="pruebas">
          <summary>Otras pruebas</summary>
          <div class="acciones">
            <button id="sin-saldo" type="button" class="ghost">Billetera en cero</button>
            <button id="repetir" type="button" class="ghost">Pagar el mismo pedido otra vez</button>
            <button id="juzgar" type="button" class="ghost">Revisar un monto que no es el real</button>
          </div>
        </details>
      </section>
    </div>

    <details class="bitacora">
      <summary>Detalle</summary>
      <p class="sub" id="resumen" hidden></p>
      <ol id="bitacora"></ol>
    </details>
    <script src="/app.js" type="module"></script>
  </body>
</html>
